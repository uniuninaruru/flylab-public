# PR-04 / Q19 diagnostic: spike events of the intact condition, for
# scripts/analysis/q19_active_types.py (which cell types fire on which side). Exploratory: one or
# two seeds; MaleCNS seed 1 is in the high whole-brain regime at 0.270 mV, seed 2 in the low one
# (calibration grid). Statistics of the rates are in the controls and cross-check groups.
schema_version: 1
kind: flylab_replicate_group
group_id: m4_q19_spikes_malecns
base_config: configs/male_cns_lb3c_mn9.yaml
base_patch:
  sensitivity: null
  model:
    overrides:
      w_syn:
        value: 0.27
        units: mV
        evidence: LEARNED
        source: docs/acceptance/evidence/m4-calibration-wsyn.json (as configs/m4/controls_wcal.yaml)
        rationale: calibrated for Shiu et al.'s criterion on this graph; not physiology
  recording: {spike_events: true}
seeds: [1, 2]
conditions:
  - name: intact
statistics: {n_boot: 1000, psth: false, metrics: [mean_rate_hz]}
